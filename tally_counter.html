
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#defcff">
  <title>Tally Counter | Rurupop Carnival</title>
  <style>
    :root{
      --bg:#defcff;
      --card:#ffffff;
      --text:#303540;
      --sub:#6d7480;
      --line:#d9e6ec;
      --pink:#ffdef6;
      --pink-strong:#ff8fcb;
      --blue:#dff1ff;
      --yellow:#fff3bf;
      --danger:#ffe3e3;
      --shadow:0 10px 28px rgba(61,102,126,.12);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    }
    button,input,select{font:inherit}
    button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .wrap{max-width:1180px;margin:auto;padding:20px 14px 40px}
    .top{
      background:rgba(255,255,255,.9);
      border-radius:28px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }
    .title-row{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      flex-wrap:wrap;
    }
    h1{margin:0;font-size:clamp(28px,5vw,42px)}
    .subtitle{margin:7px 0 0;color:var(--sub);font-size:14px}
    .time{
      background:var(--blue);
      border-radius:14px;
      padding:11px 15px;
      min-width:220px;
      text-align:center;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }
    .global-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:16px;
    }
    .global-actions button{
      border:0;
      border-radius:13px;
      min-height:44px;
      padding:0 16px;
      font-weight:800;
      background:#fff;
      box-shadow:inset 0 0 0 2px var(--line);
    }
    .global-actions .clear-all{background:var(--danger)}
    .status{min-height:20px;margin-top:9px;text-align:right;color:var(--sub);font-size:13px}
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:17px;
      box-shadow:var(--shadow);
    }
    .label{
      display:block;
      margin:0 0 6px;
      color:var(--sub);
      font-size:12px;
      font-weight:800;
    }
    .name,.value,.optnum,select{
      width:100%;
      border:2px solid var(--line);
      outline:none;
      background:#fff;
      color:var(--text);
      border-radius:13px;
    }
    .name{
      height:46px;
      padding:0 13px;
      text-align:center;
      font-size:18px;
      font-weight:800;
    }
    .value{
      height:80px;
      margin-top:10px;
      padding:0 12px;
      text-align:center;
      font-size:clamp(38px,7vw,58px);
      font-weight:900;
      font-variant-numeric:tabular-nums;
    }
    .name:focus,.value:focus,.optnum:focus,select:focus{
      border-color:var(--pink-strong);
      box-shadow:0 0 0 4px rgba(255,143,203,.14);
    }
    .main{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .main button{
      min-height:72px;
      border:0;
      border-radius:17px;
      font-size:30px;
      font-weight:900;
    }
    .minus{background:var(--blue);color:#2878ad}
    .plus{background:var(--pink);color:#be4288}
    .options-title{
      margin:14px 0 7px;
      color:var(--sub);
      font-size:12px;
      font-weight:800;
    }
    .opt{
      display:grid;
      grid-template-columns:minmax(0,1fr) 72px 86px;
      gap:7px;
      margin-top:7px;
    }
    .optnum,select{
      height:44px;
      padding:0 10px;
    }
    .optnum{text-align:center;font-weight:800}
    select{text-align:center;font-weight:800}
    .click{
      border:0;
      border-radius:13px;
      background:var(--yellow);
      color:#745d19;
      font-weight:900;
    }
    .history-title{
      margin:14px 0 7px;
      color:var(--sub);
      font-size:12px;
      font-weight:800;
    }
    .history{
      height:132px;
      overflow:auto;
      border:2px solid var(--line);
      border-radius:13px;
      padding:9px 11px;
      background:#fafafa;
      font-size:13px;
      line-height:1.7;
      font-variant-numeric:tabular-nums;
    }
    .empty{color:#9aa1aa}
    .card-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
    }
    .card-actions button{
      flex:1;
      min-height:40px;
      border:0;
      border-radius:12px;
      background:#fff;
      box-shadow:inset 0 0 0 2px var(--line);
      color:var(--sub);
      font-weight:800;
    }
    .note{
      margin:18px 0 0;
      text-align:center;
      color:var(--sub);
      font-size:12px;
    }
    @media(max-width:760px){
      .wrap{padding:10px 9px 28px}
      .top{padding:16px 13px;border-radius:22px}
      .time{width:100%}
      .global-actions button{flex:1 1 45%}
      .grid{grid-template-columns:1fr}
      .card{padding:14px}
      .opt{grid-template-columns:minmax(0,1fr) 68px 80px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div class="title-row">
        <div>
          <h1>Tally Counter</h1>
          <p class="subtitle">4つのカウンターをタップと自由入力で管理できます。</p>
        </div>
        <div id="time" class="time"></div>
      </div>

      <div class="global-actions">
        <button id="copy-all" type="button">履歴をコピー</button>
        <button id="save-all" type="button">履歴を保存</button>
        <button id="clear-all" class="clear-all" type="button">一括クリア</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section id="grid" class="grid"></section>
    <p class="note">履歴には、増減内容ではなく操作後のカウンター結果だけを記録します。</p>
  </main>

  <script>
  (() => {
    "use strict";

    const COUNTER_COUNT = 4;
    const OPTION_COUNT = 4;
    const grid = document.getElementById("grid");
    const timeEl = document.getElementById("time");
    const statusEl = document.getElementById("status");

    const state = Array.from({length: COUNTER_COUNT}, () => ({
      name: "",
      value: 0,
      options: Array.from({length: OPTION_COUNT}, () => ({amount: 100, sign: "+"})),
      history: []
    }));

    function toHalfWidth(value) {
      return String(value ?? "")
        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/[＋]/g, "+")
        .replace(/[－−ー―‐–—]/g, "-");
    }

    function normalizeInteger(value, fallback = 0, allowNegative = true) {
      let text = toHalfWidth(value).trim();
      text = allowNegative ? text.replace(/[^\d+-]/g, "") : text.replace(/[^\d]/g, "");
      const match = text.match(allowNegative ? /^[+-]?\d+/ : /^\d+/);
      if (!match) return fallback;
      const num = Number.parseInt(match[0], 10);
      return Number.isFinite(num) ? num : fallback;
    }

    function dateParts() {
      const d = new Date();
      const p = n => String(n).padStart(2, "0");
      return {
        full: `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,
        time: `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,
        file: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`
      };
    }

    function updateClock() {
      timeEl.textContent = dateParts().full;
    }

    function showStatus(message) {
      statusEl.textContent = message;
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => statusEl.textContent = "", 2500);
    }

    function displayName(index) {
      return state[index].name.trim() || `${index + 1}号機`;
    }

    function addResultHistory(index) {
      state[index].history.push({
        time: dateParts().time,
        result: state[index].value
      });
    }

    function renderHistory(index, historyEl) {
      const items = state[index].history;
      if (!items.length) {
        historyEl.innerHTML = '<span class="empty">履歴はありません</span>';
        return;
      }
      historyEl.innerHTML = items.slice().reverse()
        .map(item => `<div>${item.time}　${item.result}</div>`)
        .join("");
    }

    function updateValueDisplay(index, valueInput, historyEl) {
      valueInput.value = state[index].value;
      renderHistory(index, historyEl);
    }

    function changeValue(index, amount, valueInput, historyEl) {
      state[index].value += amount;
      addResultHistory(index);
      updateValueDisplay(index, valueInput, historyEl);
    }

    function createCard(index) {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <label class="label" for="name-${index}">カウンター名</label>
        <input id="name-${index}" class="name" type="text" maxlength="40" placeholder="${index + 1}号機">

        <label class="label" for="value-${index}" style="margin-top:10px">現在値（直接入力できます）</label>
        <input id="value-${index}" class="value" type="text" inputmode="numeric" value="0">

        <div class="main">
          <button class="minus" type="button">−1</button>
          <button class="plus" type="button">＋1</button>
        </div>

        <div class="options-title">オプション増減</div>
        <div class="options"></div>

        <div class="history-title">結果の履歴</div>
        <div class="history"></div>

        <div class="card-actions">
          <button class="reset" type="button">リセット</button>
          <button class="clear-history" type="button">履歴クリア</button>
        </div>
      `;

      const nameInput = card.querySelector(".name");
      const valueInput = card.querySelector(".value");
      const historyEl = card.querySelector(".history");
      const optionsWrap = card.querySelector(".options");

      nameInput.addEventListener("input", () => {
        state[index].name = nameInput.value;
      });

      function commitDirectValue() {
        const normalized = normalizeInteger(valueInput.value, state[index].value, true);
        valueInput.value = normalized;
        if (normalized !== state[index].value) {
          state[index].value = normalized;
          addResultHistory(index);
          renderHistory(index, historyEl);
        }
      }

      valueInput.addEventListener("input", () => {
        valueInput.value = toHalfWidth(valueInput.value);
      });

      valueInput.addEventListener("change", commitDirectValue);

      valueInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          commitDirectValue();
          valueInput.blur();
        }
      });

      card.querySelector(".minus").addEventListener("click", () => {
        changeValue(index, -1, valueInput, historyEl);
      });

      card.querySelector(".plus").addEventListener("click", () => {
        changeValue(index, 1, valueInput, historyEl);
      });

      for (let optionIndex = 0; optionIndex < OPTION_COUNT; optionIndex++) {
        const row = document.createElement("div");
        row.className = "opt";
        row.innerHTML = `
          <input class="optnum" type="text" inputmode="numeric" value="100" aria-label="オプション${optionIndex + 1}の数値">
          <select aria-label="オプション${optionIndex + 1}の符号">
            <option value="+">＋</option>
            <option value="-">－</option>
          </select>
          <button class="click" type="button">Click!</button>
        `;
        optionsWrap.appendChild(row);

        const amountInput = row.querySelector(".optnum");
        const signSelect = row.querySelector("select");
        const clickButton = row.querySelector(".click");

        amountInput.addEventListener("input", () => {
          amountInput.value = toHalfWidth(amountInput.value).replace(/[^\d]/g, "");
          state[index].options[optionIndex].amount = normalizeInteger(amountInput.value, 0, false);
        });

        amountInput.addEventListener("change", () => {
          const amount = normalizeInteger(amountInput.value, 0, false);
          state[index].options[optionIndex].amount = amount;
          amountInput.value = amount;
        });

        signSelect.addEventListener("change", () => {
          state[index].options[optionIndex].sign = signSelect.value;
        });

        clickButton.addEventListener("click", () => {
          const amount = normalizeInteger(amountInput.value, 0, false);
          amountInput.value = amount;
          state[index].options[optionIndex].amount = amount;
          const delta = signSelect.value === "-" ? -amount : amount;
          changeValue(index, delta, valueInput, historyEl);
        });
      }

      card.querySelector(".reset").addEventListener("click", () => {
        if (confirm(`${displayName(index)}を0に戻しますか？`)) {
          state[index].value = 0;
          addResultHistory(index);
          updateValueDisplay(index, valueInput, historyEl);
        }
      });

      card.querySelector(".clear-history").addEventListener("click", () => {
        if (confirm(`${displayName(index)}の履歴をクリアしますか？`)) {
          state[index].history = [];
          renderHistory(index, historyEl);
        }
      });

      renderHistory(index, historyEl);
      return card;
    }

    function buildHistoryText() {
      const lines = [
        "【Tally Counter】",
        `保存日時：${dateParts().full}`,
        ""
      ];

      state.forEach((counter, index) => {
        lines.push(`【${displayName(index)}履歴】`);
        if (!counter.history.length) {
          lines.push("履歴はありません");
        } else {
          counter.history.forEach(item => {
            lines.push(`${item.time}　${item.result}`);
          });
        }
        lines.push("");
      });

      return lines.join("\n");
    }

    document.getElementById("copy-all").addEventListener("click", async () => {
      const text = buildHistoryText();
      try {
        await navigator.clipboard.writeText(text);
        showStatus("履歴をコピーしました。");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        showStatus("履歴をコピーしました。");
      }
    });

    document.getElementById("save-all").addEventListener("click", () => {
      const blob = new Blob([buildHistoryText()], {type:"text/plain;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `TallyCounter_${dateParts().file}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showStatus("履歴を保存しました。");
    });

    document.getElementById("clear-all").addEventListener("click", () => {
      if (!confirm("すべてのカウンターと履歴をクリアしますか？")) return;

      state.forEach(counter => {
        counter.value = 0;
        counter.history = [];
      });

      document.querySelectorAll(".card").forEach((card, index) => {
        card.querySelector(".value").value = 0;
        renderHistory(index, card.querySelector(".history"));
      });

      showStatus("すべてのカウンターと履歴をクリアしました。");
    });

    for (let i = 0; i < COUNTER_COUNT; i++) {
      grid.appendChild(createCard(i));
    }

    updateClock();
    setInterval(updateClock, 1000);
  })();
  </script>
</body>
</html>
