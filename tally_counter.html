
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#defcff">
  <title>Tally Counter | Rurupop Carnival</title>
  <style>
    :root{
      --bg:#defcff;--card:#fff;--text:#303540;--sub:#6d7480;--line:#d9e6ec;
      --pink:#ffdef6;--blue:#dff1ff;--yellow:#fff3bf;--danger:#ffe3e3;
      --shadow:0 10px 28px rgba(61,102,126,.12);--radius:22px
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer;touch-action:manipulation}
    .wrap{max-width:1180px;margin:auto;padding:20px 14px 40px}
    .top{background:rgba(255,255,255,.9);border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
    .title-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
    h1{margin:0;font-size:clamp(28px,5vw,42px)} .subtitle{margin:7px 0 0;color:var(--sub);font-size:14px}
    .time{background:var(--blue);border-radius:14px;padding:11px 15px;min-width:220px;text-align:center;font-weight:800}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .actions button{border:0;border-radius:13px;min-height:44px;padding:0 16px;font-weight:800;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
    .actions .clear-all{background:var(--danger)}
    .status{min-height:20px;margin-top:9px;text-align:right;color:var(--sub);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .card{background:var(--card);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}
    .label{display:block;margin:0 0 6px;color:var(--sub);font-size:12px;font-weight:800}
    .name,.value,.optnum,select{width:100%;border:2px solid var(--line);outline:none;background:#fff;color:var(--text);border-radius:13px}
    .name{height:46px;padding:0 13px;text-align:center;font-size:18px;font-weight:800}
    .value{height:80px;margin-top:10px;padding:0 12px;text-align:center;font-size:clamp(38px,7vw,58px);font-weight:900}
    .main{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .main button{min-height:72px;border:0;border-radius:17px;font-size:30px;font-weight:900}
    .minus{background:var(--blue);color:#2878ad}.plus{background:var(--pink);color:#be4288}
    .options-title,.history-title{margin:14px 0 7px;color:var(--sub);font-size:12px;font-weight:800}
    .opt{display:grid;grid-template-columns:minmax(0,1fr) 72px 86px;gap:7px;margin-top:7px}
    .optnum,select{height:44px;padding:0 10px}.optnum{text-align:center;font-weight:800}select{text-align:center;font-weight:800}
    .click{border:0;border-radius:13px;background:var(--yellow);color:#745d19;font-weight:900}
    .history{height:132px;overflow:auto;border:2px solid var(--line);border-radius:13px;padding:9px 11px;background:#fafafa;font-size:13px;line-height:1.7}
    .empty{color:#9aa1aa}.card-actions{display:flex;gap:8px;margin-top:10px}
    .card-actions button{flex:1;min-height:40px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);color:var(--sub);font-weight:800}
    .note{margin:18px 0 0;text-align:center;color:var(--sub);font-size:12px}
    @media(max-width:760px){.wrap{padding:10px 9px 28px}.top{padding:16px 13px;border-radius:22px}.time{width:100%}.actions button{flex:1 1 45%}.grid{grid-template-columns:1fr}.card{padding:14px}.opt{grid-template-columns:minmax(0,1fr) 68px 80px}}

    /* ---------- startup (autosave restore) modal ---------- */
    .startup-modal-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(48,53,64,.45);
      z-index:1100;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .startup-modal-overlay.show{display:flex}
    .startup-modal{
      background:var(--card);
      border-radius:var(--radius);
      padding:26px 22px;
      max-width:360px;
      width:100%;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .startup-modal h3{margin:0 0 8px;font-size:17px;color:var(--text)}
    .startup-modal-desc{font-size:13.5px;color:var(--sub);margin:0 0 20px;line-height:1.6}
    .startup-modal-buttons{display:flex;gap:8px;justify-content:center}
    .startup-modal-buttons button{flex:1;border:0;border-radius:13px;min-height:44px;padding:0 14px;font-weight:800}
    #startupFreshBtn{background:#fff;box-shadow:inset 0 0 0 2px var(--line);color:var(--sub)}
    #startupContinueBtn{background:var(--pink);color:#be4288}
  </style>
</head>
<body>
<div id="startupModalOverlay" class="startup-modal-overlay">
  <div class="startup-modal">
    <h3>前回のデータが見つかりました</h3>
    <p class="startup-modal-desc">続きを開きますか？</p>
    <div class="startup-modal-buttons">
      <button id="startupFreshBtn">新しく始める</button>
      <button id="startupContinueBtn">続きから始める</button>
    </div>
  </div>
</div>
<main class="wrap">
  <section class="top">
    <div class="title-row">
      <div><h1>Tally Counter</h1><p class="subtitle">カウンターは最大30台まで追加できます。</p></div>
      <div id="time" class="time"></div>
    </div>
    <div class="actions">
      <button id="add-counter">＋ カウンター追加</button>
      <button id="remove-counter">－ 最後のカウンター削除</button>
      <button id="copy-all">履歴をコピー</button>
      <button id="save-all">履歴を保存</button>
      <button id="clear-all" class="clear-all">一括クリア</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="grid" class="grid"></section>
  <p class="note">履歴には、操作後のカウンター結果だけを記録します。</p>
</main>

<script>
(() => {
  "use strict";
  const MIN_COUNTERS = 4;
  const MAX_COUNTERS = 30;
  const OPTION_COUNT = 4;

  const grid = document.getElementById("grid");
  const timeEl = document.getElementById("time");
  const statusEl = document.getElementById("status");
  const startupModalOverlay = document.getElementById("startupModalOverlay");
  const startupContinueBtn = document.getElementById("startupContinueBtn");
  const startupFreshBtn = document.getElementById("startupFreshBtn");
  const state = [];

  function toHalfWidth(value){
    return String(value ?? "")
      .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
      .replace(/[＋]/g,"+")
      .replace(/[－−ー―‐–—]/g,"-");
  }

  function normalizeInteger(value,fallback=0,allowNegative=true){
    let text=toHalfWidth(value).trim();
    text=allowNegative?text.replace(/[^\d+-]/g,""):text.replace(/[^\d]/g,"");
    const match=text.match(allowNegative?/^[+-]?\d+/:/^\d+/);
    if(!match)return fallback;
    const num=parseInt(match[0],10);
    return Number.isFinite(num)?num:fallback;
  }

  function dateParts(){
    const d=new Date(),p=n=>String(n).padStart(2,"0");
    return {
      full:`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,
      time:`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,
      file:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`
    };
  }

  function showStatus(msg){
    statusEl.textContent=msg;
    clearTimeout(showStatus.timer);
    showStatus.timer=setTimeout(()=>statusEl.textContent="",2500);
  }

  function displayName(index){return state[index].name.trim()||`${index+1}号機`}

  function addResultHistory(index){
    state[index].history.push({time:dateParts().time,result:state[index].value});
  }

  function renderHistory(index,el){
    const items=state[index].history;
    el.innerHTML=items.length
      ? items.slice().reverse().map(x=>`<div>${x.time}　${x.result}</div>`).join("")
      : '<span class="empty">履歴はありません</span>';
  }

  /* ============ autosave (localStorage) ============
   * RuruPop Carnival 共通仕様: 変更のたびに自動保存し、
   * 次回起動時に「続きから始める / 新しく始める」を選べるようにする。
   * ツールごとに個別のキーを持ち、既存の「履歴をコピー／保存」機能とは独立している。
   */
  const AUTOSAVE_KEY = "rurupopCarnival:tallyCounter:autosave:v1";

  function buildAutosavePayload(){
    return {
      counters: state.map(counter=>({
        name: counter.name,
        value: counter.value,
        history: counter.history.map(h=>({time:h.time,result:h.result})),
        options: counter.options.map(o=>({amount:o.amount,sign:o.sign}))
      }))
    };
  }

  function autoSaveNow(){
    try{
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(buildAutosavePayload()));
    }catch(e){
      // ストレージが使用できない/満杯などの場合は、操作を妨げないよう静かに無視する
    }
  }

  let autoSaveTimer = null;
  function scheduleAutoSave(){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(autoSaveNow, 400);
  }

  function clearAutoSave(){
    try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){}
  }

  function loadAutosaveRaw(){
    try{
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      return null;
    }
  }

  function restoreFromAutosave(data){
    try{
      const saved = Array.isArray(data && data.counters) ? data.counters : [];
      if(!saved.length) return;

      state.length = 0;
      grid.innerHTML = "";

      const count = Math.min(Math.max(saved.length, MIN_COUNTERS), MAX_COUNTERS);
      for(let i=0;i<count;i++){
        createCounter(saved[i] || null);
      }
      rebuildIndexes();
    }catch(e){
      console.error("自動保存データの復元に失敗しました", e);
    }
  }

  function createCounter(initial){
    const index=state.length;
    const options = (initial && Array.isArray(initial.options) && initial.options.length===OPTION_COUNT)
      ? initial.options.map(o=>({amount:normalizeInteger(o && o.amount,100,false),sign:(o && o.sign==="-")?"-":"+"}))
      : Array.from({length:OPTION_COUNT},()=>({amount:100,sign:"+"}));
    const counter={
      name: (initial && typeof initial.name==="string") ? initial.name : "",
      value: (initial && Number.isFinite(initial.value)) ? initial.value : 0,
      history: (initial && Array.isArray(initial.history))
        ? initial.history.map(h=>({time:String((h && h.time)||""),result:Number(h && h.result)||0}))
        : [],
      options
    };
    state.push(counter);

    const card=document.createElement("article");
    card.className="card";
    card.dataset.index=index;
    card.innerHTML=`
      <label class="label">カウンター名</label>
      <input class="name" type="text" maxlength="40" placeholder="${index+1}号機">
      <label class="label" style="margin-top:10px">現在値（直接入力できます）</label>
      <input class="value" type="text" inputmode="numeric" value="0">
      <div class="main">
        <button class="minus">−1</button>
        <button class="plus">＋1</button>
      </div>
      <div class="options-title">オプション増減</div>
      <div class="options"></div>
      <div class="history-title">結果の履歴</div>
      <div class="history"></div>
      <div class="card-actions">
        <button class="reset">リセット</button>
        <button class="clear-history">履歴クリア</button>
      </div>`;

    grid.appendChild(card);

    const nameInput=card.querySelector(".name");
    const valueInput=card.querySelector(".value");
    const historyEl=card.querySelector(".history");
    const optionsWrap=card.querySelector(".options");

    nameInput.value=counter.name;
    valueInput.value=counter.value;

    nameInput.addEventListener("input",()=>{counter.name=nameInput.value;scheduleAutoSave();});

    function commitValue(){
      const v=normalizeInteger(valueInput.value,counter.value,true);
      valueInput.value=v;
      if(v!==counter.value){
        counter.value=v;
        addResultHistory(index);
        renderHistory(index,historyEl);
        autoSaveNow();
      }
    }

    valueInput.addEventListener("input",()=>valueInput.value=toHalfWidth(valueInput.value));
    valueInput.addEventListener("change",commitValue);
    valueInput.addEventListener("keydown",e=>{if(e.key==="Enter"){commitValue();valueInput.blur()}});

    function change(delta){
      counter.value+=delta;
      addResultHistory(index);
      valueInput.value=counter.value;
      renderHistory(index,historyEl);
      autoSaveNow();
    }

    card.querySelector(".minus").onclick=()=>change(-1);
    card.querySelector(".plus").onclick=()=>change(1);

    for(let j=0;j<OPTION_COUNT;j++){
      const row=document.createElement("div");
      row.className="opt";
      row.innerHTML=`
        <input class="optnum" type="text" inputmode="numeric" value="100">
        <select><option value="+">＋</option><option value="-">－</option></select>
        <button class="click">Click!</button>`;
      optionsWrap.appendChild(row);

      const amount=row.querySelector(".optnum");
      const sign=row.querySelector("select");
      amount.value=String(counter.options[j].amount);
      sign.value=counter.options[j].sign;

      amount.addEventListener("input",()=>{
        amount.value=toHalfWidth(amount.value).replace(/[^\d]/g,"");
        counter.options[j].amount=normalizeInteger(amount.value,100,false);
        scheduleAutoSave();
      });
      sign.addEventListener("change",()=>{
        counter.options[j].sign=sign.value;
        autoSaveNow();
      });
      row.querySelector(".click").onclick=()=>{
        const n=normalizeInteger(amount.value,0,false);
        amount.value=n;
        counter.options[j].amount=n;
        change(sign.value==="-"?-n:n);
      };
    }

    card.querySelector(".reset").onclick=()=>{
      if(confirm(`${displayName(index)}を0に戻しますか？`)){
        counter.value=0;
        addResultHistory(index);
        valueInput.value=0;
        renderHistory(index,historyEl);
        autoSaveNow();
      }
    };

    card.querySelector(".clear-history").onclick=()=>{
      if(confirm(`${displayName(index)}の履歴をクリアしますか？`)){
        counter.history=[];
        renderHistory(index,historyEl);
        autoSaveNow();
      }
    };

    renderHistory(index,historyEl);
  }

  function rebuildIndexes(){
    [...grid.children].forEach((card,index)=>{
      card.dataset.index=index;
      card.querySelector(".name").placeholder=`${index+1}号機`;
    });
  }

  function buildHistoryText(){
    const lines=["【Tally Counter】",`保存日時：${dateParts().full}`,""];
    state.forEach((counter,index)=>{
      lines.push(`【${displayName(index)}履歴】`);
      if(counter.history.length){
        counter.history.forEach(item=>lines.push(`${item.time}　${item.result}`));
      }else{
        lines.push("履歴はありません");
      }
      lines.push("");
    });
    return lines.join("\n");
  }

  document.getElementById("add-counter").onclick=()=>{
    if(state.length>=MAX_COUNTERS){showStatus("カウンターは最大30台です。");return}
    createCounter();
    showStatus(`${state.length}台になりました。`);
    autoSaveNow();
  };

  document.getElementById("remove-counter").onclick=()=>{
    if(state.length<=MIN_COUNTERS){showStatus("カウンターは4台未満にできません。");return}
    const last=state.length-1;
    if(!confirm(`${displayName(last)}を削除しますか？`))return;
    state.pop();
    grid.lastElementChild.remove();
    rebuildIndexes();
    showStatus(`${state.length}台になりました。`);
    autoSaveNow();
  };

  document.getElementById("copy-all").onclick=async()=>{
    const text=buildHistoryText();
    try{await navigator.clipboard.writeText(text)}
    catch{
      const ta=document.createElement("textarea");
      ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
    }
    showStatus("履歴をコピーしました。");
  };

  document.getElementById("save-all").onclick=()=>{
    const blob=new Blob([buildHistoryText()],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`TallyCounter_${dateParts().file}.txt`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    showStatus("履歴を保存しました。");
  };

  document.getElementById("clear-all").onclick=()=>{
    if(!confirm("すべてのカウンターの値と履歴をクリアしますか？"))return;
    state.forEach(c=>{c.value=0;c.history=[]});
    [...grid.children].forEach((card,index)=>{
      card.querySelector(".value").value=0;
      renderHistory(index,card.querySelector(".history"));
    });
    showStatus("すべての値と履歴をクリアしました。");
    autoSaveNow();
  };

  for(let i=0;i<MIN_COUNTERS;i++)createCounter();
  timeEl.textContent=dateParts().full;
  setInterval(()=>timeEl.textContent=dateParts().full,1000);

  /* ============ init / autosave restore prompt ============ */
  (function initAutosavePrompt(){
    const saved = loadAutosaveRaw();
    if(!saved || !Array.isArray(saved.counters) || !saved.counters.length){
      return; // 保存データなし。通常の初期状態のまま。
    }
    startupModalOverlay.classList.add("show");

    startupContinueBtn.addEventListener("click", function(){
      restoreFromAutosave(saved);
      startupModalOverlay.classList.remove("show");
    });

    startupFreshBtn.addEventListener("click", function(){
      clearAutoSave();
      startupModalOverlay.classList.remove("show");
      // state はすでに初期状態のままなので追加の処理は不要
    });
  })();
})();
</script>
</body>
</html>
