<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#defcff" />
  <title>DICE | Rurupop Carnival</title>
  <style>
    :root {
      --bg: #defcff;
      --card: #ffffff;
      --ink: #3e4050;
      --muted: #777b8c;
      --line: #dbe5ea;
      --pink: #ff8fc7;
      --pink-dark: #ef70b1;
      --yellow: #fff3aa;
      --shadow: 0 10px 28px rgba(75, 106, 120, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 8%, rgba(255,255,255,.72) 0 55px, transparent 56px),
        radial-gradient(circle at 88% 13%, rgba(255,255,255,.58) 0 36px, transparent 37px),
        var(--bg);
      padding: 24px 14px 48px;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-mark {
      width: 78px;
      height: 78px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 42px;
      transform: rotate(-4deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 44px);
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .hint {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

    input[type="number"] {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      outline: none;
      transition: .18s ease;
    }

    input[type="number"]:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 143, 199, .16);
    }

    .roll-button {
      width: 100%;
      margin-top: 16px;
      min-height: 54px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(180deg, #ffa7d3, var(--pink));
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--pink-dark);
      transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
    }

    .roll-button:hover {
      filter: brightness(1.025);
    }

    .roll-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--pink-dark);
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      text-align: center;
      color: #d64f75;
      font-size: 13px;
      font-weight: 700;
    }

    .history-section {
      margin-top: 18px;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .history-title {
      margin: 0;
      font-size: 18px;
    }

    .history-count {
      display: inline-block;
      min-width: 26px;
      padding: 2px 8px;
      margin-left: 4px;
      border-radius: 999px;
      background: var(--yellow);
      font-size: 12px;
      text-align: center;
      vertical-align: 2px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .sub-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      padding: 9px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s ease;
    }

    .sub-button:hover {
      border-color: var(--pink);
      background: #fff7fb;
    }

    .sub-button.danger:hover {
      color: #c84565;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-empty {
      padding: 28px 14px;
      border: 2px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      background: rgba(255,255,255,.55);
    }

    .result-card {
      position: relative;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      animation: pop .22s ease-out;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(-5px) scale(.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .result-expression {
      margin-bottom: 9px;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: .03em;
    }

    .result-line {
      margin: 5px 0;
      line-height: 1.55;
      word-break: break-word;
    }

    .result-final {
      display: inline-block;
      margin-top: 4px;
      padding: 5px 10px;
      border-radius: 10px;
      background: #fff2f8;
      color: #c94584;
      font-weight: 850;
    }

    .result-time {
      position: absolute;
      top: 17px;
      right: 17px;
      color: #a0a4b0;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 18px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(62, 64, 80, .94);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: rgba(62,64,80,.58);
      font-size: 11px;
      letter-spacing: .04em;
    }

    @media (max-width: 560px) {
      body {
        padding-top: 18px;
      }

      .card {
        padding: 16px;
        border-radius: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .history-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .history-actions {
        width: 100%;
      }

      .sub-button {
        flex: 1;
      }

      .result-time {
        position: static;
        display: block;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="logo-mark" aria-hidden="true">🎲</div>
      <h1>DICE</h1>
      <p class="subtitle">Rurupop Carnival</p>
    </header>

    <section class="card" aria-label="ダイス設定">
      <div class="form-grid">
        <div>
          <label for="sides">
            面の数
            <span class="hint">2～999999</span>
          </label>
          <input id="sides" type="number" inputmode="numeric" min="2" max="999999" step="1" value="6" />
        </div>

        <div>
          <label for="diceCount">
            サイコロの数
            <span class="hint">1～10</span>
          </label>
          <input id="diceCount" type="number" inputmode="numeric" min="1" max="10" step="1" value="1" />
        </div>

        <div>
          <label for="modifierValue">
            補正
            <span class="hint">0～999</span>
          </label>
          <div style="display:flex;gap:8px">
            <select id="modifierSign" style="height:48px;border:2px solid #dbe5ea;border-radius:14px;padding:0 10px;font:inherit;background:#fff;">
              <option value="+">＋</option>
              <option value="-">－</option>
            </select>
            <input id="modifierValue" type="text" inputmode="numeric" value="0" style="flex:1" />
          </div>
        </div>
      </div>

      <button id="rollButton" class="roll-button" type="button">🎲 Roll!</button>
      <div id="message" class="message" role="alert" aria-live="polite"></div>
    </section>

    <section class="history-section" aria-label="履歴">
      <div class="history-head">
        <h2 class="history-title">
          履歴 <span id="historyCount" class="history-count">0</span>
        </h2>
        <div class="history-actions">
          <button id="copyButton" class="sub-button" type="button">📋 履歴をコピー</button>
          <button id="saveButton" class="sub-button" type="button">💾 履歴を保存</button>
          <button id="clearButton" class="sub-button danger" type="button">🗑️ 履歴をクリア</button>
        </div>
      </div>

      <div id="historyList" class="history-list"></div>
    </section>

    <p class="footer">データはこの端末のブラウザ内だけに保存されます。</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "rurupop-carnival-dice-history-v1";

      const sidesInput = document.getElementById("sides");
      const diceCountInput = document.getElementById("diceCount");
      const modifierSign = document.getElementById("modifierSign");
      const modifierInput = document.getElementById("modifierValue");
      const rollButton = document.getElementById("rollButton");
      const copyButton = document.getElementById("copyButton");
      const saveButton = document.getElementById("saveButton");
      const clearButton = document.getElementById("clearButton");
      const message = document.getElementById("message");
      const historyList = document.getElementById("historyList");
      const historyCount = document.getElementById("historyCount");
      const toast = document.getElementById("toast");

      let history = loadHistory();

      function loadHistory() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          console.warn("履歴を読み込めませんでした。", error);
          return [];
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        } catch (error) {
          console.warn("履歴を保存できませんでした。", error);
          showToast("履歴を保存できませんでした");
        }
      }

      
      function normalizeNumericInput(value) {
        return value
          .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0))
          .replace(/[＋]/g, "+")
          .replace(/[－ー―ｰ−]/g, "-")
          .trim();
      }

      function parseInteger(input, label, min, max) {
        input.value = normalizeNumericInput(input.value);
        const raw = input.value.trim();

        if (raw === "") {
          throw new Error(`${label}を入力してください。`);
        }

        const value = Number(raw);

        if (!Number.isInteger(value)) {
          throw new Error(`${label}は整数で入力してください。`);
        }

        if (value < min || value > max) {
          throw new Error(`${label}は${min}～${max}で入力してください。`);
        }

        return value;
      }

      function secureRandomInt(min, max) {
        const range = max - min + 1;

        if (window.crypto && window.crypto.getRandomValues && range > 0) {
          const maxUint = 0xFFFFFFFF;
          const limit = maxUint - (maxUint % range);
          const array = new Uint32Array(1);
          let value;

          do {
            window.crypto.getRandomValues(array);
            value = array[0];
          } while (value >= limit);

          return min + (value % range);
        }

        return Math.floor(Math.random() * range) + min;
      }

      function formatExpression(count, sides, modifier) {
        const base = `${count}D${sides}`;
        if (modifier > 0) return `${base} +${modifier}`;
        if (modifier < 0) return `${base} ${modifier}`;
        return base;
      }

      function rollDice() {
        message.textContent = "";

        try {
          const sides = parseInteger(sidesInput, "面の数", 2, 999999);
          const count = parseInteger(diceCountInput, "サイコロの数", 1, 10);
          const modifierAbs = parseInteger(modifierInput, "補正値", 0, 999);
          const modifier = modifierSign.value==="-" ? -modifierAbs : modifierAbs;

          const rolls = Array.from({ length: count }, () => secureRandomInt(1, sides));
          const diceTotal = rolls.reduce((sum, value) => sum + value, 0);
          const finalTotal = diceTotal + modifier;

          const result = {
            id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            sides,
            count,
            modifier,
            rolls,
            diceTotal,
            finalTotal,
            createdAt: new Date().toISOString()
          };

          history.push(result);
          saveHistory();
          renderHistory();

          requestAnimationFrame(() => {
            const cards = historyList.querySelectorAll(".result-card");
            const newest = cards[cards.length - 1];
            if (newest) {
              newest.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
          });
        } catch (error) {
          message.textContent = error.message;
        }
      }

      function resultToText(result) {
        const lines = [
          formatTime(result.createdAt),
          "",
          `🎲 ${formatExpression(result.count, result.sides, result.modifier)}`,
          "",
          `出目：${result.rolls.join("・")}`,
          `合計：${result.diceTotal}`
        ];

        if (result.modifier !== 0) {
          lines.push(`結果：${result.finalTotal}`);
        }

        return lines.join("\n");
      }

      function formatTime(isoString) {
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return "";
        const pad = (n) => String(n).padStart(2, "0");
        return `${date.getFullYear()}/${pad(date.getMonth()+1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      }

      function createResultCard(result) {
        const article = document.createElement("article");
        article.className = "result-card";

        const expression = document.createElement("div");
        expression.className = "result-expression";
        expression.textContent = `🎲 ${formatExpression(result.count, result.sides, result.modifier)}`;

        const rolls = document.createElement("p");
        rolls.className = "result-line";
        rolls.textContent = `出目：${result.rolls.join("・")}`;

        const total = document.createElement("p");
        total.className = "result-line";
        total.textContent = `合計：${result.diceTotal}`;

        article.append(expression, rolls, total);

        if (result.modifier !== 0) {
          const final = document.createElement("div");
          final.className = "result-final";
          final.textContent = `結果：${result.finalTotal}`;
          article.appendChild(final);
        }

        const time = document.createElement("time");
        time.className = "result-time";
        time.dateTime = result.createdAt;
        time.textContent = formatTime(result.createdAt);
        article.appendChild(time);

        return article;
      }

      function renderHistory() {
        historyList.textContent = "";
        historyCount.textContent = String(history.length);

        if (history.length === 0) {
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = "履歴はありません";
          historyList.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        history.forEach((result) => fragment.appendChild(createResultCard(result)));
        historyList.appendChild(fragment);
      }

      async function copyHistory() {
        if (history.length === 0) {
          showToast("コピーする履歴がありません");
          return;
        }

        const text = history.map(resultToText).join("\n\n──────────\n\n");

        try {
          await navigator.clipboard.writeText(text);
          showToast("履歴をコピーしました");
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();

          try {
            document.execCommand("copy");
            showToast("履歴をコピーしました");
          } catch (fallbackError) {
            showToast("コピーできませんでした");
          } finally {
            textarea.remove();
          }
        }
      }

      function clearHistory() {
        if (history.length === 0) {
          showToast("履歴はありません");
          return;
        }

        if (!window.confirm("履歴をすべて削除しますか？")) {
          return;
        }

        history = [];
        saveHistory();
        renderHistory();
        showToast("履歴をクリアしました");
      }

      let toastTimer;

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
      }

      rollButton.addEventListener("click", rollDice);
      copyButton.addEventListener("click", copyHistory);
      saveButton.addEventListener("click", () => {
        if (history.length===0){showToast("保存する履歴がありません");return;}
        const textData = history.map(resultToText).join("\n\n──────────\n\n");
        const blob = new Blob([textData], {type:"text/plain;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a=document.createElement("a");
        const pad=n=>String(n).padStart(2,"0");
        const d=new Date();
        a.href=url;
        a.download=`DICE_History_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast("履歴を保存しました");
      });
      clearButton.addEventListener("click", clearHistory);

      [sidesInput, diceCountInput, modifierInput].forEach((input) => {
        input.addEventListener("blur", () => {
          input.value = normalizeNumericInput(input.value);
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            rollDice();
          }
        });
      });

      renderHistory();
    })();
  </script>
</body>
</html>
